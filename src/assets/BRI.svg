<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%">
  <defs>
    <style>
      .bri-text {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 118px;
        font-weight: 900;
        fill: #00529C;
        letter-spacing: -1px;
      }
    </style>
  </defs>

  <!-- Latar Belakang Putih -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <g transform="translate(30, 35)">
    <!-- Kotak Luar Logo Simbol BRI -->
    <rect x="10" y="15" width="150" height="150" rx="28" ry="28" fill="none" stroke="#00529C" stroke-width="16" />

    <!-- Elemen Garis/Pola di Dalam Kotak BRI -->
    <!-- Wave / Ribbon 1 (Kiri) -->
    <path d="M 38 42 C 48 42 58 52 58 67 C 58 82 38 97 38 112 C 38 127 58 137 68 137" fill="none" stroke="#00529C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Wave / Ribbon 2 (Tengah) -->
    <path d="M 72 42 C 82 42 92 52 92 67 C 92 82 72 97 72 112 C 72 127 92 137 102 137" fill="none" stroke="#00529C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Diagonal Line (Kanan Bawah) -->
    <path d="M 90 102 L 132 137" fill="none" stroke="#00529C" stroke-width="14" stroke-linecap="round" />

    <!-- Teks BRI -->
    <text x="185" y="133" class="bri-text">BRI</text>
  </g>
</svg>